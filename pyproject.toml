[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thingsexpiretracker"
version = "1.2.0"
description = "Track licences, certificates, contracts and warranties, and get reminded before they lapse."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
thingsexpiretracker = "thingsexpiretracker.cli:main"

[tool.setuptools]
packages = ["thingsexpiretracker"]

[tool.setuptools.package-data]
thingsexpiretracker = ["dashboard.html"]

[tool.ruff]
line-length = 130
target-version = "py310"
